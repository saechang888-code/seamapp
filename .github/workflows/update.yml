name: 주일 설교 목록 갱신
on:
  schedule:
    - cron: '0 6,9,12 * * 0'   # 주일 오후 3·6·9시 (한국 시각)
    - cron: '0 1 * * 1'        # 월요일 오전 10시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - run: |
          git config user.name "seam-bot"
          git config user.email "seam-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "설교 목록 갱신 $(TZ=Asia/Seoul date +%F)" && git push)
